repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(sushie/(anndata_output|models|outputs|pipeline_cli|preparation|stats)|tests/test_(anndata_output|outputs|pipeline_cli|preparation|stats))\.py$
      - id: ruff-format
        files: ^(sushie/(anndata_output|models|outputs|pipeline_cli|preparation|stats)|tests/test_(anndata_output|outputs|pipeline_cli|preparation|stats))\.py$
