[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sushie"
dynamic = ["version"]
description = "SNP fine-mapping of molecular data across ancestries using SuShiE"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Zeyun Lu", email = "zeyun_lu@dfci.harvard.edu" },
    { name = "Nicholas Mancuso", email = "Nicholas.Mancuso@med.usc.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
]
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.11",
    "jax",
    "jaxlib",
    "pandas",
    "pandas-plink",
    "polars>=1",
    "pyarrow>=14",
    "pydantic>=2",
    "loguru>=0.7",
    "typer>=0.16",
    "equinox",
    "scipy",
    "glimix-core",
    "bgen-reader",
    "cyvcf2",
]

[project.optional-dependencies]
testing = [
    "prek",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]
dev = [
    "pymdown-extensions",
    "pytest-accept",
    "pytest-cov",
    "prek",
    "ruff",
    "sphinx>=5",
    "sphinx-immaterial",
    "ty",
]

[project.urls]
Homepage = "https://github.com/mancusolab/sushie"
Source = "https://github.com/mancusolab/sushie"
Tracker = "https://github.com/mancusolab/sushie/issues"

[project.scripts]
sushie = "sushie.pipeline_cli:app"
sushie-legacy = "sushie.cli:run_cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "sushie/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["tests/", "data/", "docs/", "misc/"]

[tool.hatch.build.targets.wheel]
packages = ["sushie"]

[tool.pytest.ini_options]
addopts = "--cov sushie --cov-report term-missing --verbose"
norecursedirs = ["dist", "build", ".tox"]
testpaths = ["tests"]

[tool.mypy]
allow_redefinition = true
